id = "herdrpp"
name = "herdr++"
version = "0.5.0"
min_herdr_version = "0.9.5"
description = "Search workspaces and tabs, and show GitHub PR and CI status"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "--target-dir", "target"]

[[startup]]
command = ["./target/release/herdrpp", "start"]

[[actions]]
id = "open"
title = "Search workspaces, worktrees and tabs"
command = ["./target/release/herdrpp", "open"]

[[actions]]
id = "start"
title = "Start automatic PR/CI refresh"
command = ["./target/release/herdrpp", "start"]

[[actions]]
id = "refresh"
title = "Refresh workspace PR and CI status"
command = ["./target/release/herdrpp", "refresh"]

[[actions]]
id = "stop"
title = "Stop automatic PR/CI refresh"
command = ["./target/release/herdrpp", "stop"]

[[panes]]
id = "picker"
title = "Workspaces and tabs"
placement = "popup"
width = "80%"
height = 22
command = ["./target/release/herdrpp", "pick"]

[[actions]]
id = "commands"
title = "Open command palette"
command = ["./target/release/herdrpp", "commands"]

[[panes]]
id = "command-palette"
title = "Command Palette"
placement = "popup"
width = "80%"
height = 22
command = ["./target/release/herdrpp", "pick-command"]

[[actions]]
id = "tasks"
title = "Run workspace tasks"
command = ["./target/release/herdrpp", "tasks"]

[[panes]]
id = "task-palette"
title = "Task Palette"
placement = "popup"
width = "80%"
height = 22
command = ["./target/release/herdrpp", "pick-task"]
