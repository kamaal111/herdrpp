[project]
name = "herdrpp-tests"
version = "0.0.0"
requires-python = ">=3.15,<3.16"

[tool.uv]
package = false
exclude-newer = "1 day"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["snapshot: real Herdr sidebar tests run in the pinned Docker environment"]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "pillow>=11.3",
    "pyte>=0.8.2",
    "pytest>=9.1.1",
    "wcwidth==0.2.13",
]
