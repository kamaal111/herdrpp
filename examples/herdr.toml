# Apply on the computer displaying the Herdr client, including for remote use.
# Reload config from that client's in-app menu after editing.
# Replace $pr_number with the PR and CI tokens in your existing rows.
[[keys.command]]
key = "cmd+shift+r"
type = "plugin_action"
command = "herdrpp.tasks"
description = "Run workspace tasks"

[ui.sidebar.spaces]
rows = [
  [
    "state_icon", "workspace",
    { token = "$pr_open", fg = "#238636" },
    { token = "$pr_draft", fg = "#8b949e" },
    { token = "$pr_merged", fg = "#a371f7" },
    { token = "$pr_closed", fg = "#f85149" },
    { token = "$ci_passed", fg = "#238636" },
    { token = "$ci_failed", fg = "#f85149" },
    { token = "$ci_pending", fg = "#d29922" },
  ],
  ["branch", "git_status"],
]

[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "herdrpp.open"
description = "Search workspaces, worktrees and tabs"

[[keys.command]]
key = "cmd+shift+k"
type = "plugin_action"
command = "herdrpp.commands"
description = "Open command palette"
