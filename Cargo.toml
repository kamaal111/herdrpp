[package]
name = "herdrpp"
# Release versions are managed by Release Please.
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Workspace search and GitHub PR status for Herdr"
repository = "https://github.com/kamaal111/herdrpp"
readme = "README.md"
license = "MIT AND Apache-2.0"
keywords = ["herdr", "terminal", "picker", "workspace"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
terminal_input = { package = "helix-crossterm", version = "=0.1.0-beta.1" }
nucleo-matcher = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
unicode-width = "0.2"

libc = "0.2"
tempfile = "3.20"
toml_edit = "0.22.27"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
